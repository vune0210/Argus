name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      AUTH_MODE: mock
      NEXT_PUBLIC_AUTH_MODE: mock
      DATABASE_URL: postgres://argus:argus@127.0.0.1:5432/argus
      ARGUS_API_URL: http://127.0.0.1:4000
      REDIS_URL: redis://127.0.0.1:6379
      ARGUS_LOAD_GATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.19.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argus/api db:migrate
      - run: pnpm verify
      - run: pnpm test:migrations
      - run: pnpm test:week4
      - run: pnpm audit --audit-level high

  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/argus-probe

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.19.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --filter argus --frozen-lockfile
      - run: docker build -f apps/api/Dockerfile -t argus-api:ci .
      - run: docker build -f apps/web/Dockerfile -t argus-web:ci .
      - run: docker build -f agents/probe/Dockerfile -t argus-probe:ci .
      - run: docker compose config --quiet
      - name: Validate runtime ProbeResult contract
        run: |
          docker compose up -d --wait test-target
          docker run --rm --network argus_default \
            -e ARGUS_ENV=test \
            -e ARGUS_PROBE_ID=ci-probe \
            -e ARGUS_REGION=ci \
            -e ARGUS_ALLOW_PRIVATE_TARGETS=true \
            -v "${{ github.workspace }}/packages/contracts/examples:/contracts:ro" \
            argus-probe:ci execute-file /contracts/probe-job.docker.json > probe-result.json
          node scripts/validate-probe-result.mjs probe-result.json
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: argus-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: argus-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          skip-setup-trivy: true
      - name: Scan probe image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: argus-probe:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          skip-setup-trivy: true
      - name: Stop contract test target
        if: always()
        run: docker compose down

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform/probes fmt -check -recursive
      - run: terraform -chdir=infra/terraform/probes init -backend=false
      - run: terraform -chdir=infra/terraform/probes validate
      - run: terraform -chdir=infra/terraform/probes test

  fresh-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARGUS_CHAOS_LOCAL: "true"
      DATABASE_URL: postgres://argus:argus@127.0.0.1:5432/argus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build --wait
      - run: pnpm test:chaos
      - name: Collect stack logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop fresh stack
        if: always()
        run: docker compose down

  e2e:
    runs-on: ubuntu-latest
    needs: [node, probe]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      AUTH_MODE: mock
      NEXT_PUBLIC_AUTH_MODE: mock
      DATABASE_URL: postgres://argus:argus@127.0.0.1:5432/argus
      ARGUS_API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @argus/api db:migrate
      - run: pnpm --filter @argus/web exec playwright install --with-deps chromium
      - run: pnpm --filter @argus/domain build
      - run: pnpm --filter @argus/api dev & pnpm --filter @argus/web dev &
      - run: pnpm exec wait-on http://localhost:4000/health/ready http://localhost:3000/login
      - run: pnpm --filter @argus/web test:e2e
